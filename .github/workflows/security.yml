name: Security and regression checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Deliberately unreachable test DB. Never use production secrets in this job.
      DATABASE_URL: postgresql://sam_test:sam_test@127.0.0.1:5432/sam_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-production-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare

